name: Datos de mercado

# Lo dispara cron-job.org a las 06:15 de Buenos Aires, de lunes a viernes.
# No usa el horario propio de GitHub porque en cuentas gratuitas se atrasa
# varias horas. También se puede correr a mano con "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-24.04
    # Hora de Buenos Aires para todo el trabajo: así la fecha que buscan los
    # scripts es siempre la del día en Argentina, corra a la hora que corra.
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bajar cierres
        run: python scripts/bajar_datos.py

      - name: Guardar en el repositorio
        run: |
          git config user.name "market-brief-bot"
          git config user.email "actions@github.com"
          git add data/market_data.json
          git diff --staged --quiet || git commit -m "datos de mercado $(date +%F)"
          git push
